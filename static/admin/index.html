<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>License Admin</title>

<style>
body {
    font-family: system-ui, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    padding: 30px;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: #020617;
    padding: 25px;
    border-radius: 10px;
}

h2 { margin-bottom: 20px; }

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.controls div {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

input, select {
    padding: 8px;
    border-radius: 4px;
    border: none;
}

button {
    padding: 10px 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

button.primary { background: #22c55e; color: #000; }
button.warn { background: #facc15; color: #000; }
button.danger { background: #ef4444; color: #fff; }

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #334155;
}

th { text-align: left; }
code { font-size: 12px; }
</style>
</head>

<body>
<div class="container">
    <h2>License Management</h2>

    <div class="controls">
        <div>
            <label>Duration (Days)</label>
            <select id="days">
                <option value="30">30</option>
                <option value="90">90</option>
                <option value="365">365</option>
            </select>
        </div>

        <div>
            <label>Max Devices</label>
            <input type="number" id="max_devices" value="1" min="1">
        </div>

        <div>
            <label>Assign User (Email)</label>
            <input type="text" id="user_email" placeholder="optional">
        </div>

        <button class="primary" onclick="createLicense()">Create License</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Key</th>
                <th>Status</th>
                <th>Devices</th>
                <th>Expires</th>
                <th>Assigned</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="licenseTable"></tbody>
    </table>
</div>

<script>
/*
  IMPORTANT:
  Paste a valid Supabase ACCESS TOKEN here.
  This is what authenticates you as admin.
*/
const ACCESS_TOKEN = "PASTE_SUPABASE_ACCESS_TOKEN_HERE";

const headers = {
    "Authorization": "Bearer " + ACCESS_TOKEN,
    "Content-Type": "application/json"
};

async function fetchLicenses() {
    const res = await fetch("/admin/licenses", { headers });
    if (!res.ok) {
        alert("Unauthorized or token expired");
        return;
    }

    const data = await res.json();
    const tbody = document.getElementById("licenseTable");
    tbody.innerHTML = "";

    data.forEach(l => {
        tbody.innerHTML += `
        <tr>
            <td><code>${l.license_key}</code></td>
            <td>${l.active ? "✅ Active" : "❌ Revoked"}</td>
            <td>${l.max_devices}</td>
            <td>${l.expires_at ? new Date(l.expires_at).toLocaleDateString() : "-"}</td>
            <td>${l.assigned_users.join(", ") || "-"}</td>
            <td>
                <button class="warn" onclick="toggleStatus('${l.license_key}', ${l.active})">
                    ${l.active ? "Revoke" : "Activate"}
                </button>
                <button class="danger" onclick="deleteLicense('${l.license_key}')">
                    Delete
                </button>
            </td>
        </tr>`;
    });
}

async function createLicense() {
    const payload = {
        days: parseInt(days.value),
        max_devices: parseInt(max_devices.value),
        assigned_users: user_email.value ? [user_email.value] : []
    };

    await fetch("/admin/licenses", {
        method: "POST",
        headers,
        body: JSON.stringify(payload)
    });

    user_email.value = "";
    fetchLicenses();
}

async function toggleStatus(key, active) {
    const action = active ? "revoke" : "reactivate";
    await fetch(`/admin/licenses/${key}/${action}`, {
        method: "POST",
        headers
    });
    fetchLicenses();
}

async function deleteLicense(key) {
    if (!confirm("Delete license permanently?")) return;
    await fetch(`/admin/licenses/${key}`, {
        method: "DELETE",
        headers
    });
    fetchLicenses();
}

fetchLicenses();
</script>
</body>
</html>
