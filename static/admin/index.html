<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>License Admin Console</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
--bg:#0f172a;
--panel:#111827;
--card:#1e293b;
--border:#334155;
--text:#f1f5f9;
--muted:#94a3b8;
--accent:#6366f1;
--accent-hover:#818cf8;
--success:#10b981;
--danger:#ef4444;
}

[data-theme="light"]{
--bg:#f8fafc;
--panel:#ffffff;
--card:#ffffff;
--border:#e2e8f0;
--text:#0f172a;
--muted:#64748b;
--accent:#4f46e5;
--accent-hover:#6366f1;
}

*{box-sizing:border-box;}
body{
margin:0;
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
transition:.3s ease;
}

/* Layout */
.container{
max-width:1200px;
margin:auto;
padding:30px 20px 60px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
gap:15px;
flex-wrap:wrap;
}

.header h1{
font-size:22px;
margin:0;
font-weight:700;
letter-spacing:.3px;
}

.header-actions{
display:flex;
align-items:center;
gap:10px;
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:18px;
padding:22px;
margin-bottom:24px;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

/* Buttons */
button{
cursor:pointer;
border-radius:10px;
border:none;
padding:10px 16px;
font-size:13px;
font-weight:600;
transition:.2s;
}

.primary{
background:var(--accent);
color:#fff;
}
.primary:hover{background:var(--accent-hover);}

.secondary{
background:transparent;
border:1px solid var(--border);
color:var(--muted);
}
.secondary:hover{border-color:var(--accent);color:var(--accent);}

.danger{
background:rgba(239,68,68,.1);
border:1px solid var(--danger);
color:var(--danger);
}

.icon-btn{
width:40px;
height:40px;
display:flex;
align-items:center;
justify-content:center;
background:var(--panel);
border:1px solid var(--border);
border-radius:12px;
cursor:pointer;
}

/* Inputs */
input{
width:100%;
padding:10px 12px;
border-radius:10px;
border:1px solid var(--border);
background:var(--panel);
color:var(--text);
font-size:13px;
outline:none;
}

.input-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:12px;
}

/* Table */
.table-wrapper{
overflow-x:auto;
border-radius:16px;
}

table{
width:100%;
border-collapse:collapse;
min-width:850px;
}

th{
text-align:left;
padding:16px;
font-size:11px;
text-transform:uppercase;
letter-spacing:.7px;
color:var(--muted);
border-bottom:1px solid var(--border);
}

td{
padding:16px;
border-bottom:1px solid var(--border);
vertical-align:top;
font-size:13px;
}

.status{
padding:5px 10px;
border-radius:999px;
font-size:11px;
font-weight:600;
}

.status.active{
background:rgba(16,185,129,.15);
color:var(--success);
}

.status.inactive{
background:rgba(148,163,184,.15);
color:var(--muted);
}

.license-key{
font-family:monospace;
font-weight:700;
color:var(--accent);
}

/* Device Panel */
.device-panel{
margin-top:10px;
background:var(--panel);
border:1px solid var(--border);
border-radius:12px;
padding:12px;
display:none;
}

.device-row{
display:flex;
justify-content:space-between;
align-items:center;
padding:6px 0;
gap:10px;
font-size:12px;
}

.device-row input{
background:transparent;
border:none;
color:inherit;
padding:4px;
font-size:12px;
}

.last-seen{
font-size:10px;
color:var(--muted);
font-family:monospace;
}

/* Toast */
.toast{
position:fixed;
bottom:20px;
right:20px;
background:var(--panel);
border:1px solid var(--border);
padding:12px 18px;
border-radius:12px;
font-size:13px;
box-shadow:0 8px 20px rgba(0,0,0,0.3);
opacity:0;
transform:translateY(20px);
transition:.3s;
}
.toast.show{
opacity:1;
transform:translateY(0);
}

/* Mobile */
@media(max-width:768px){
.header{
flex-direction:column;
align-items:flex-start;
}
}
</style>
</head>

<body data-theme="dark">

<div class="container">

<!-- LOGIN -->
<div id="login-section" class="card" style="max-width:400px;margin:120px auto;text-align:center;">
<h2 style="margin-top:0;">Admin Access</h2>
<button class="primary" style="width:100%;" onclick="login()">Continue with Google</button>
</div>

<!-- PANEL -->
<div id="admin-panel" style="display:none;">

<div class="header">
<h1>License Control Center</h1>
<div class="header-actions">
<div class="icon-btn" onclick="toggleTheme()">🌓</div>
<button class="secondary" onclick="logout()">Logout</button>
</div>
</div>

<!-- CREATE -->
<div class="card">
<h3 style="margin-top:0;">Create New License</h3>
<div class="input-grid">
<input id="max_devices" type="number" placeholder="Max Devices" value="1">
<input id="days" type="number" placeholder="Validity (Days)" value="30">
<input id="user_email" type="text" placeholder="Assigned User (Optional)">
<button class="primary" onclick="create()">Generate License</button>
</div>
</div>

<!-- TABLE -->
<div class="card table-wrapper">
<table>
<thead>
<tr>
<th>License</th>
<th>Status</th>
<th>Usage</th>
<th>Expiry</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>
</div>

<div id="toast" class="toast"></div>

<script>
const SB_URL="https://efhcunpogynphopqcqze.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmaGN1bnBvZ3lucGhvcHFjcXplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg1MzgzOTIsImV4cCI6MjA4NDExNDM5Mn0.Zg2_kT7aqrOAZTMP-RHuct41eCap99SMSau0IPaAG58";
const _supabase=supabase.createClient(SB_URL,SB_KEY);

function showToast(msg){
const t=document.getElementById("toast");
t.innerText=msg;
t.classList.add("show");
setTimeout(()=>t.classList.remove("show"),2500);
}

function toggleTheme(){
const b=document.body;
b.setAttribute("data-theme",
b.getAttribute("data-theme")==="dark"?"light":"dark");
}

async function login(){
await _supabase.auth.signInWithOAuth({
provider:"google",
options:{redirectTo:window.location.href}
});
}

async function logout(){
await _supabase.auth.signOut();
location.reload();
}

async function getHeaders(){
const {data:{session}}=await _supabase.auth.getSession();
return{
Authorization:`Bearer ${session?.access_token}`,
"Content-Type":"application/json"
};
}

async function copyKey(k){
await navigator.clipboard.writeText(k);
showToast("License copied");
}

async function load(){
const r=await fetch("/admin/licenses",{headers:await getHeaders()});
const data=await r.json();
const tbody=document.getElementById("tbody");
tbody.innerHTML="";

data.forEach((lic,idx)=>{
let row=`
<tr>
<td>
<span class="license-key">${lic.license_key}</span>
<button class="secondary" style="margin-left:8px;" onclick="copyKey('${lic.license_key}')">Copy</button>
<button class="secondary" style="margin-left:6px;" onclick="toggleDetails(${idx})">Devices</button>
<div id="dev-${idx}" class="device-panel">
${lic.devices.map((d,i)=>`
<div class="device-row">
<input value="${lic.assigned_users[i]||'Device '+(i+1)}"
onchange="saveUser('${lic.license_key}',${idx})">
<span class="last-seen">${new Date(d.last_seen).toLocaleString()}</span>
</div>
`).join("")}
</div>
</td>

<td>
<span class="status ${lic.active?'active':'inactive'}">
${lic.active?'ACTIVE':'INACTIVE'}
</span>
</td>

<td>${lic.used_devices}/${lic.max_devices}</td>

<td>${new Date(lic.expires_at).toLocaleDateString()}</td>

<td>
<button class="secondary"
onclick="toggleStatus('${lic.license_key}',${lic.active})">
${lic.active?'Revoke':'Reactivate'}
</button>
<button class="danger"
onclick="deleteLic('${lic.license_key}')">Delete</button>
</td>
</tr>
`;
tbody.innerHTML+=row;
});
}

function toggleDetails(i){
const d=document.getElementById(`dev-${i}`);
d.style.display=d.style.display==="block"?"none":"block";
}

async function saveUser(k,idx){
const inputs=document.querySelectorAll(`#dev-${idx} input`);
const names=Array.from(inputs).map(i=>i.value);
await fetch(`/admin/licenses/${k}`,{
method:"PATCH",
headers:await getHeaders(),
body:JSON.stringify({assigned_users:names})
});
showToast("Saved");
}

async function toggleStatus(k,active){
await fetch(`/admin/licenses/${k}/${active?'revoke':'reactivate'}`,
{method:"POST",headers:await getHeaders()});
load();
}

async function deleteLic(k){
if(confirm("Delete license permanently?")){
await fetch(`/admin/licenses/${k}`,{
method:"DELETE",headers:await getHeaders()
});
showToast("Deleted");
load();
}
}

async function create(){
await fetch("/admin/licenses",{
method:"POST",
headers:await getHeaders(),
body:JSON.stringify({
max_devices:parseInt(document.getElementById("max_devices").value),
days:parseInt(document.getElementById("days").value),
assigned_users:document.getElementById("user_email").value?
[document.getElementById("user_email").value]:[]
})
});
showToast("License created");
load();
}

async function initAuth() {
  const { data: { session } } = await _supabase.auth.getSession();

  if (session) {
    document.getElementById("login-section").style.display = "none";
    document.getElementById("admin-panel").style.display = "block";
    load();
  }

  _supabase.auth.onAuthStateChange((event, session) => {
    if (session) {
      document.getElementById("login-section").style.display = "none";
      document.getElementById("admin-panel").style.display = "block";
      load();
    }
  });
}

initAuth();
</script>

</body>
</html>
