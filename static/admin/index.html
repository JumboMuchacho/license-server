<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard | Device Management</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#0f172a; --card:#1e293b; --border:#334155; --text:#f1f5f9; --muted:#94a3b8; --accent:#6366f1; --danger:#ef4444; }
body { margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); padding:40px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; box-shadow:0 10px 15px -3px rgba(0,0,0,0.3); margin-bottom: 20px; }
.analytics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
.stat-box { text-align: center; }
.stat-val { font-size: 24px; font-weight: 700; color: var(--accent); margin-top: 8px; }
table { width:100%; border-collapse:collapse; margin-top:20px; }
th { text-align:left; color:var(--muted); font-size:12px; text-transform:uppercase; padding:12px; border-bottom:1px solid var(--border); }
td { padding:16px; border-bottom:1px solid var(--border); font-size:14px; }
button { cursor:pointer; border-radius:8px; border:none; padding:8px 16px; font-size:12px; font-weight:600; transition:.2s; }
.secondary { background:var(--border); color:#fff; }
.danger { background:var(--danger); color:#fff; }
.status-badge { padding:4px 8px; border-radius:6px; font-size:11px; font-weight:bold; }
.status-active { background:#065f46; color:#34d399; }
.status-inactive { background:#991b1b; color:#f87171; }
</style>
</head>
<body>

<div id="login-section" style="max-width:400px; margin:100px auto; text-align:center;">
    <h2>Admin Access</h2>
    <button class="secondary" style="padding:12px 24px;" onclick="login()">Continue with Google</button>
</div>

<div id="admin-panel" style="display:none; max-width:1000px; margin:auto;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h1>Device Registry</h1>
        <button class="secondary" onclick="logout()">Logout</button>
    </div>

    <div class="analytics-grid">
        <div class="card stat-box">
            <label>Total Revenue (KES)</label>
            <div id="stat-revenue" class="stat-val">0</div>
        </div>
        <div class="card stat-box">
            <label>Total Transactions</label>
            <div id="stat-txns" class="stat-val">0</div>
        </div>
        <div class="card stat-box">
            <label>Success Rate</label>
            <div id="stat-success" class="stat-val">0%</div>
        </div>
    </div>

    <div class="card">
        <h3>Device Growth</h3>
        <canvas id="growthChart" height="100"></canvas>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Device ID</th>
                    <th>Status</th>
                    <th>Tokens</th>
                    <th>Last Seen</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="devices-tbody"></tbody>
        </table>
    </div>
</div>

<script>
let _supabase;
let growthChart;

async function initAdmin() {
    const configRes = await fetch("/admin/config");
    if (!configRes.ok) {
        const errorText = await configRes.text();
        console.error("Config fetch failed:", errorText);
        document.getElementById("login-section").innerHTML =
            `<h2>Admin Access</h2><p>Error: ${configRes.status} - ${errorText}</p>`;
        return;
    }
    const config = await configRes.json();
    _supabase = supabase.createClient(config.supabase_url, config.supabase_anon_key);

    _supabase.auth.onAuthStateChange((event, session) => {
        if (session) {
            document.getElementById("login-section").style.display = "none";
            document.getElementById("admin-panel").style.display = "block";
            load();
        }
    });
}

async function getHeaders() {
    const { data: { session } } = await _supabase.auth.getSession();
    return { Authorization: `Bearer ${session?.access_token}`, "Content-Type": "application/json" };
}

// 1. Initialize Chart
function initChart(data) {
    const ctx = document.getElementById('growthChart').getContext('2d');
    if (growthChart) growthChart.destroy(); // Clear existing chart on refresh
    growthChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: data.labels, // Expecting labels: ['Mon', 'Tue', ...]
            datasets: [{ label: 'New Devices', data: data.values, borderColor: '#6366f1', fill: true }]
        }
    });
}

async function resetProduction() {
    if (!confirm("WARNING: This will wipe all transaction history and reset all user balances. Proceed?")) return;

    await fetch("/admin/reset-analytics", {
        method: "POST",
        headers: await getHeaders()
    });
    alert("Production reset complete.");
    load(); // Refresh your dashboard
}

async function load() {
    const headers = await getHeaders();

    // Fetch both simultaneously
    const [devicesRes, analyticsRes] = await Promise.all([
        fetch("/admin/devices", { headers }),
        fetch("/admin/analytics", { headers })
    ]);

    // Check if the server actually returned data
    if (!devicesRes.ok || !analyticsRes.ok) {
        console.error("Fetch failed", devicesRes.status, analyticsRes.status);
        return;
    }

    const data = await devicesRes.json();
    const analytics = await analyticsRes.json();

    // Render Table
    const tbody = document.getElementById("devices-tbody");
    tbody.innerHTML = data.map(d => `
        <tr>
            <td style="font-family:monospace; color:var(--accent);">${d.device_id}</td>
            <td><span class="status-badge ${d.active ? 'status-active' : 'status-inactive'}">${d.active ? 'Active' : 'Suspended'}</span></td>
            <td style="color:#fbbf24; font-weight:700;">${d.token_balance}</td>
            <td style="color:var(--muted);">${d.created_at ? new Date(d.created_at).toLocaleString() : 'Never'}</td>
            <td>
                <button class="secondary" onclick="updateBalance('${d.device_id}', 'add')">+</button>
                <button class="danger" onclick="updateBalance('${d.device_id}', 'sub')">-</button>
                <button class="danger" onclick="deleteDevice('${d.device_id}')">Delete</button>
            </td>
        </tr>
    `).join('');

    // Update Stats and Chart
    document.getElementById("stat-revenue").textContent = (analytics.revenue || 0).toLocaleString();
    document.getElementById("stat-txns").textContent = (analytics.total_txns || 0).toLocaleString();

    // Add safety check before initializing chart
    if (analytics.growth_data && analytics.growth_data.labels) {
        initChart(analytics.growth_data);
    }
}

async function updateBalance(id, action) {
    const amount = prompt("Enter token amount:");
    if (!amount) return;
    const val = action === 'sub' ? -parseInt(amount) : parseInt(amount);
    await fetch(`/admin/devices/${id}`, {
        method: "PATCH",
        headers: await getHeaders(),
        body: JSON.stringify({ token_adjustment: val })
    });
    load();
}

async function deleteDevice(id) {
    if (confirm("Delete device permanently?")) {
        await fetch(`/admin/devices/${id}`, { method: "DELETE", headers: await getHeaders() });
        load();
    }
}

async function login() { await _supabase.auth.signInWithOAuth({ provider: "google" }); }
async function logout() { await _supabase.auth.signOut(); location.reload(); }

initAdmin();
</script>
</body>
</html>
