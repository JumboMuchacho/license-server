<!DOCTYPE html>
<html>
<head>
    <title>License Admin Console</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #0f172a; color: #f8fafc; margin: 0; }
        .container { max-width: 1100px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #334155; }
        
        /* Form elements */
        input { background: #0f172a; border: 1px solid #475569; color: white; padding: 10px; margin: 5px; border-radius: 6px; width: 100%; max-width: 250px; box-sizing: border-box; }
        button { padding: 10px 18px; cursor: pointer; border-radius: 6px; border: none; font-weight: bold; transition: 0.2s; }
        .primary { background: #22c55e; color: #052e16; }
        .danger { background: #ef4444; color: white; }
        .secondary { background: #475569; color: white; }
        .hidden { display: none; }
        
        /* Table responsive behavior */
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; min-width: 600px; }
        th { text-align: left; background: #334155; padding: 12px; font-size: 14px; }
        td { padding: 12px; border-bottom: 1px solid #334155; font-size: 14px; vertical-align: middle; }
        
        /* User identifier dropdown */
        .user-btn { background: #3b82f6; color: white; border-radius: 50%; width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; border: none; }
        .user-details { background: #0f172a; padding: 10px; border-radius: 6px; margin-top: 8px; font-size: 12px; border: 1px solid #3b82f6; display: none; word-break: break-all; }
        .status-active { color: #22c55e; font-weight: bold; }
        .status-revoked { color: #94a3b8; }

        /* Mobile specific fixes */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .card { padding: 15px; }
            h2 { font-size: 1.2rem; }
            input { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="login-section" class="card" style="text-align: center;">
            <h2>Admin Authentication</h2>
            <button class="primary" onclick="login()">Login with Google</button>
        </div>

        <div id="admin-panel" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin:0;">Dashboard</h2>
                <button class="secondary" onclick="logout()">Logout</button>
            </div>

            <div class="card">
                <h3>Generate New License</h3>
                <div style="display: flex; flex-wrap: wrap; gap: 5px;">
                    <input id="max_devices" type="number" placeholder="Devices" value="1">
                    <input id="days" type="number" placeholder="Days Valid" value="30">
                    <input id="user_email" type="text" placeholder="User Identifier (e.g. Email)">
                    <button class="primary" onclick="create()">Create</button>
                </div>
            </div>

            <div class="card">
                <h3>Records</h3>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Key</th>
                                <th>Status</th>
                                <th>Dev</th>
                                <th>Expires</th>
                                <th>User</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="license-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<script>
    const SB_URL = "https://efhcunpogynphopqcqze.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmaGN1bnBvZ3lucGhvcHFjcXplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg1MzgzOTIsImV4cCI6MjA4NDExNDM5Mn0.Zg2_kT7aqrOAZTMP-RHuct41eCap99SMSau0IPaAG58";
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function checkUser() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session) {
            document.getElementById("login-section").classList.add("hidden");
            document.getElementById("admin-panel").classList.remove("hidden");
            load();
        }
    }

    async function login() {
        const targetUrl = window.location.origin + window.location.pathname;
        await _supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: targetUrl } });
    }

    async function logout() { await _supabase.auth.signOut(); location.reload(); }

    async function getHeaders() {
        const { data: { session } } = await _supabase.auth.getSession();
        return { "Authorization": "Bearer " + session?.access_token, "Content-Type": "application/json" };
    }

    function toggleUser(id) {
        const el = document.getElementById('user-info-' + id);
        el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    async function load() {
        const headers = await getHeaders();
        const r = await fetch("/admin/licenses", { headers });
        const data = await r.json();
        
        const tbody = document.getElementById("license-table-body");
        tbody.innerHTML = "";
        data.forEach((lic, index) => {
            const userDisplay = (lic.assigned_users && lic.assigned_users.length > 0) 
                ? lic.assigned_users[0] 
                : "No data";

            const row = `<tr>
                <td style="font-family: monospace; font-size: 11px;">${lic.license_key}</td>
                <td class="${lic.active ? 'status-active' : 'status-revoked'}">${lic.active ? 'ACTIVE' : 'OFF'}</td>
                <td>${lic.max_devices}</td>
                <td>${new Date(lic.expires_at).toLocaleDateString()}</td>
                <td>
                    <button class="user-btn" onclick="toggleUser(${index})">👤</button>
                    <div id="user-info-${index}" class="user-details">${userDisplay}</div>
                </td>
                <td>
                    <div style="display: flex; gap: 4px;">
                        <button onclick="toggleStatus('${lic.license_key}', ${lic.active})" style="background: #475569; font-size: 10px; padding: 6px;">${lic.active ? 'Revoke' : 'On'}</button>
                        <button class="danger" onclick="deleteLic('${lic.license_key}')" style="font-size: 10px; padding: 6px;">Del</button>
                    </div>
                </td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    async function toggleStatus(key, current) {
        const headers = await getHeaders();
        await fetch(`/admin/licenses/${key}/${current ? 'revoke' : 'reactivate'}`, { method: 'POST', headers });
        load();
    }

    async function deleteLic(key) {
        if(!confirm("Permanently delete?")) return;
        const headers = await getHeaders();
        await fetch(`/admin/licenses/${key}`, { method: 'DELETE', headers });
        load();
    }

    async function create() {
        const headers = await getHeaders();
        const iden = document.getElementById("user_email").value;
        await fetch("/admin/licenses", {
            method: "POST",
            headers,
            body: JSON.stringify({
                max_devices: parseInt(document.getElementById("max_devices").value),
                days: parseInt(document.getElementById("days").value),
                assigned_users: iden ? [iden] : []
            })
        });
        document.getElementById("user_email").value = "";
        load();
    }
    checkUser();
</script>
</body>
</html>
