<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>License Server – Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Supabase JS SDK -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: #e5e7eb;
      padding: 40px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }
    button {
      background: #fff;
      color: #000;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.9;
    }
    #panel {
      margin-top: 30px;
      display: none;
    }
    table {
      border-collapse: collapse;
      margin-top: 20px;
      width: 100%;
    }
    th, td {
      border-bottom: 1px solid #334155;
      padding: 8px;
      text-align: left;
    }
  </style>
</head>
<body>

<h1>🔐 License Server – Admin</h1>

<button id="loginBtn">Sign in with Google</button>

<div id="panel">
  <h2>Licenses</h2>
  <button onclick="createLicense()">Create License</button>
  <table id="licenses"></table>
</div>

<script>
  /* ================================
     CONFIG — MUST MATCH SUPABASE
     ================================ */

  const SUPABASE_URL = "https://efhcunpogynphopqcqze.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmaGN1bnBvZ3lucGhvcHFjcXplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg1MzgzOTIsImV4cCI6MjA4NDExNDM5Mn0.Zg2_kT7aqrOAZTMP-RHuct41eCap99SMSau0IPaAG58";

  const supabase = supabaseJs.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  /* ================================
     AUTH FLOW
     ================================ */

  document.getElementById("loginBtn").onclick = async () => {
    await supabase.auth.signInWithOAuth({
      provider: "google",
      options: {
        redirectTo: "https://license-server-lewp.onrender.com/admin-ui"
      }
    });
  };

  async function getSession() {
    const { data } = await supabase.auth.getSession();
    return data.session;
  }

  /* ================================
     API CALLS
     ================================ */

  async function fetchLicenses() {
    const session = await getSession();
    if (!session) return;

    const res = await fetch("/admin/licenses", {
      headers: {
        Authorization: "Bearer " + session.access_token
      }
    });

    const data = await res.json();
    renderLicenses(data);
  }

  async function createLicense() {
    const session = await getSession();
    if (!session) return;

    await fetch("/admin/licenses", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + session.access_token
      },
      body: JSON.stringify({ max_devices: 1, days: 30 })
    });

    fetchLicenses();
  }

  function renderLicenses(list) {
    const table = document.getElementById("licenses");
    table.innerHTML = `
      <tr>
        <th>Key</th>
        <th>Active</th>
        <th>Max Devices</th>
        <th>Expires</th>
      </tr>
    `;

    list.forEach(l => {
      table.innerHTML += `
        <tr>
          <td>${l.license_key}</td>
          <td>${l.active}</td>
          <td>${l.max_devices}</td>
          <td>${l.expires_at || "-"}</td>
        </tr>
      `;
    });
  }

  /* ================================
     AUTO-LOGIN HANDLING
     ================================ */

  (async () => {
    const session = await getSession();
    if (session) {
      document.getElementById("loginBtn").style.display = "none";
      document.getElementById("panel").style.display = "block";
      fetchLicenses();
    }
  })();
</script>

</body>
</html>
