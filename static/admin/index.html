<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a; --card-bg: #161c2d; --accent: #6366f1; --accent-hover: #818cf8;
            --success: #10b981; --danger: #ef4444; --text-main: #f8fafc; --text-dim: #94a3b8;
            --border: #2d3748; --input-bg: #0b0f1a;
        }
        [data-theme="light"] {
            --bg: #f1f5f9; --card-bg: #ffffff; --accent: #4f46e5; --accent-hover: #6366f1;
            --success: #10b981; --danger: #ef4444; --text-main: #0f172a; --text-dim: #64748b;
            --border: #e2e8f0; --input-bg: #f8fafc;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); margin: 0; transition: 0.3s; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .card { background: var(--card-bg); padding: 24px; border-radius: 16px; margin-bottom: 24px; border: 1px solid var(--border); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .theme-btn { background: var(--border); cursor: pointer; border-radius: 10px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
        .input-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
        input { background: var(--input-bg); border: 1px solid var(--border); color: var(--text-main); padding: 10px; border-radius: 8px; font-size: 13px; outline: none; }
        button { padding: 8px 14px; cursor: pointer; border-radius: 8px; border: none; font-weight: 600; font-size: 13px; transition: 0.2s; }
        .primary { background: var(--accent); color: white; }
        .secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
        .danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        .copy-btn { background: transparent; color: var(--text-dim); padding: 4px; font-size: 14px; margin-left: 5px; }
        .copy-btn:hover { color: var(--accent); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 16px; font-size: 11px; text-transform: uppercase; color: var(--text-dim); border-bottom: 1px solid var(--border); }
        td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
        .license-key { font-family: monospace; color: var(--accent); font-weight: 700; letter-spacing: 0.5px; }
        .user-details { 
            background: rgba(0,0,0,0.15); padding: 12px; border-radius: 8px; margin-top: 8px; border: 1px solid var(--border); 
            display: none; max-height: 180px; overflow-y: auto; 
        }
        .device-slot { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; padding: 6px; background: var(--bg); border-radius: 6px; }
        .last-seen { font-size: 10px; color: var(--text-dim); font-family: monospace; }
        .saving-indicator { font-size: 10px; color: var(--success); display: none; margin-left: 10px; font-style: italic; }
        .hidden { display: none; }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <div id="login-section" class="card" style="max-width:400px; margin: 100px auto; text-align: center;">
            <h2>Admin Login</h2>
            <button class="primary" style="width:100%;" onclick="login()">Login with Google</button>
        </div>

        <div id="admin-panel" class="hidden">
            <div class="header">
                <h2 style="margin:0;">License Manager</h2>
                <div class="header-actions">
                    <div class="theme-btn" onclick="toggleTheme()" id="theme-icon">☀️</div>
                    <button class="secondary" onclick="logout()">Logout</button>
                </div>
            </div>

            <div class="card">
                <h4 style="margin-top:0;">Create License</h4>
                <div class="input-group">
                    <input id="max_devices" type="number" placeholder="Max Users" value="1">
                    <input id="days" type="number" placeholder="Validity Days" value="30">
                    <input id="user_email" type="text" placeholder="User Email/ID">
                    <button class="primary" onclick="create()">Generate</button>
                </div>
            </div>

            <div class="card" style="padding: 0; overflow: hidden;">
                <table id="lic-table">
                    <thead>
                        <tr><th>License Key</th><th>Status</th><th>Usage</th><th>Expires</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    const SB_URL = "https://efhcunpogynphopqcqze.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmaGN1bnBvZ3lucGhvcHFjcXplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg1MzgzOTIsImV4cCI6MjA4NDExNDM5Mn0.Zg2_kT7aqrOAZTMP-RHuct41eCap99SMSau0IPaAG58";
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    let saveTimeout = null;

    function toggleTheme() {
        const b = document.body;
        const next = b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        b.setAttribute('data-theme', next);
        document.getElementById('theme-icon').innerText = next === 'dark' ? '☀️' : '🌙';
    }

async function login() {
    // This MUST match the URL in your Supabase 'Allow List'
    const target = "https://license-server-lewp.onrender.com/admin-ui";
    await _supabase.auth.signInWithOAuth({ 
        provider: 'google', 
        options: { redirectTo: target } 
    });
    }

    async function logout() { await _supabase.auth.signOut(); location.reload(); }
    async function getHeaders() {
        const { data: { session } } = await _supabase.auth.getSession();
        return { "Authorization": `Bearer ${session?.access_token}`, "Content-Type": "application/json" };
    }

    async function copyKey(val) {
        await navigator.clipboard.writeText(val);
        alert("Copied!");
    }

    function autoSave(key, index) {
        if(saveTimeout) clearTimeout(saveTimeout);
        const ind = document.getElementById(`save-ind-${index}`);
        if(ind) ind.style.display = "inline";
        saveTimeout = setTimeout(async () => {
            const inputs = document.querySelectorAll(`.name-input-${index}`);
            const names = Array.from(inputs).map(i => i.value || i.placeholder);
            await fetch(`/admin/licenses/${key}`, { 
                method: 'PATCH', 
                headers: await getHeaders(), 
                body: JSON.stringify({ assigned_users: names }) 
            });
            if(ind) ind.style.display = "none";
        }, 800);
    }

    async function load() {
        const r = await fetch("/admin/licenses", { headers: await getHeaders() });
        const data = await r.json();
        const tbody = document.getElementById("tbody");
        tbody.innerHTML = "";

        data.forEach((lic, idx) => {
            const used = lic.used_devices;
            const heading = (lic.assigned_users && lic.assigned_users[0]) || "New Info";
            let devHtml = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                            <span style="font-weight:bold; color:var(--accent); font-size:12px;">${heading}</span>
                            <span id="save-ind-${idx}" class="saving-indicator">Saving...</span>
                          </div>`;
            
            if (used === 0) {
                devHtml += `<input type="text" class="name-input-${idx}" placeholder="User Info" value="${lic.assigned_users[0] || ''}" oninput="autoSave('${lic.license_key}', ${idx})" style="width:100%;">`;
            } else {
                for (let i = 0; i < used; i++) {
                    const name = lic.assigned_users[i] || `Device ${i+1}`;
                    const seen = lic.devices[i] ? new Date(lic.devices[i].last_seen).toLocaleTimeString() : "Offline";
                    devHtml += `<div class="device-slot">
                        <input type="text" class="name-input-${idx}" value="${name}" oninput="autoSave('${lic.license_key}', ${idx})" style="width:100px; border:none; background:transparent; color:inherit; font-size:11px;">
                        <span class="last-seen">${seen}</span>
                    </div>`;
                }
            }

            tbody.innerHTML += `<tr>
                <td>
                    <span class="license-key">${lic.license_key}</span>
                    <button class="copy-btn" onclick="copyKey('${lic.license_key}')">📋</button>
                    <button class="secondary" style="padding:4px 8px; margin-left:5px;" onclick="const d=document.getElementById('details-${idx}'); d.style.display=d.style.display==='block'?'none':'block'">👤</button>
                    <div id="details-${idx}" class="user-details">${devHtml}</div>
                </td>
                <td style="color:${lic.active ? 'var(--success)' : 'var(--text-dim)'}; font-weight:bold;">${lic.active ? 'ACTIVE' : 'OFF'}</td>
                <td>${used}/${lic.max_devices}</td>
                <td>${new Date(lic.expires_at).toLocaleDateString()}</td>
                <td>
                    <button class="secondary" onclick="toggleStatus('${lic.license_key}', ${lic.active})">Toggle</button>
                    <button class="danger" onclick="deleteLic('${lic.license_key}')">Del</button>
                </td>
            </tr>`;
        });
    }

    async function toggleStatus(k, curr) {
        await fetch(`/admin/licenses/${k}/${curr?'revoke':'reactivate'}`, { method:'POST', headers: await getHeaders() });
        load();
    }
    async function deleteLic(k) {
        if(confirm("Delete?")) {
            await fetch(`/admin/licenses/${k}`, { method:'DELETE', headers: await getHeaders() });
            load();
        }
    }
    async function create() {
        const user = document.getElementById("user_email").value;
        await fetch("/admin/licenses", {
            method: "POST", headers: await getHeaders(),
            body: JSON.stringify({
                max_devices: parseInt(document.getElementById("max_devices").value),
                days: parseInt(document.getElementById("days").value),
                assigned_users: user ? [user] : []
            })
        });
        load();
    }

    async function checkUser() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session) {
            document.getElementById("login-section").classList.add("hidden");
            document.getElementById("admin-panel").classList.remove("hidden");
            load();
        }
    }
    checkUser();
</script>
</body>
</html>
