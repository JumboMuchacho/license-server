<!DOCTYPE html>
<html>
<head>
    <title>License Admin Console</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 30px; background: #0f172a; color: #f8fafc; }
        .container { max-width: 1000px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #334155; }
        input { background: #0f172a; border: 1px solid #475569; color: white; padding: 10px; margin: 5px; border-radius: 6px; width: 180px; }
        button { padding: 10px 18px; cursor: pointer; border-radius: 6px; border: none; font-weight: bold; transition: 0.2s; }
        .primary { background: #22c55e; color: #052e16; }
        .primary:hover { background: #4ade80; }
        .danger { background: #ef4444; color: white; }
        .secondary { background: #64748b; color: white; }
        .hidden { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; background: #334155; padding: 12px; }
        td { padding: 12px; border-bottom: 1px solid #334155; }
        .status-active { color: #22c55e; font-weight: bold; }
        .status-inactive { color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <div id="login-section" class="card" style="text-align: center;">
            <h2>Admin Authentication</h2>
            <button class="primary" onclick="login()">Login with Google</button>
        </div>

        <div id="admin-panel" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>License Dashboard</h2>
                <button class="secondary" onclick="logout()">Logout</button>
            </div>

            <div class="card">
                <h3>Generate New License</h3>
                <input id="max_devices" type="number" placeholder="Devices" value="1">
                <input id="days" type="number" placeholder="Days Valid" value="30">
                <input id="user_email" type="text" placeholder="User Email (optional)" style="width: 250px;">
                <button class="primary" onclick="create()">Create</button>
            </div>

            <div class="card">
                <h3>Database Records</h3>
                <button class="secondary" onclick="load()" style="margin-bottom: 10px;">Refresh Data</button>
                <table>
                    <thead>
                        <tr>
                            <th>License Key</th>
                            <th>Status</th>
                            <th>Devices</th>
                            <th>Expires</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="license-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    const SB_URL = "https://efhcunpogynphopqcqze.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmaGN1bnBvZ3lucGhvcHFjcXplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg1MzgzOTIsImV4cCI6MjA4NDExNDM5Mn0.Zg2_kT7aqrOAZTMP-RHuct41eCap99SMSau0IPaAG58";
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function checkUser() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session) {
            document.getElementById("login-section").classList.add("hidden");
            document.getElementById("admin-panel").classList.remove("hidden");
            load();
        }
    }

    async function login() {
        const targetUrl = window.location.origin + window.location.pathname;
        await _supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: targetUrl } });
    }

    async function logout() { await _supabase.auth.signOut(); location.reload(); }

    async function getHeaders() {
        const { data: { session } } = await _supabase.auth.getSession();
        return { "Authorization": "Bearer " + session?.access_token, "Content-Type": "application/json" };
    }

    async function load() {
        const headers = await getHeaders();
        const r = await fetch("/admin/licenses", { headers });
        const data = await r.json();
        
        const tbody = document.getElementById("license-table-body");
        tbody.innerHTML = "";
        data.forEach(lic => {
            const row = `<tr>
                <td style="font-family: monospace;">${lic.license_key}</td>
                <td class="${lic.active ? 'status-active' : 'status-inactive'}">${lic.active ? 'ACTIVE' : 'REVOKED'}</td>
                <td>${lic.max_devices}</td>
                <td>${new Date(lic.expires_at).toLocaleDateString()}</td>
                <td>
                    <button onclick="toggleStatus('${lic.license_key}', ${lic.active})" style="background: #475569; font-size: 11px;">${lic.active ? 'Revoke' : 'Reactivate'}</button>
                    <button class="danger" onclick="deleteLic('${lic.license_key}')" style="font-size: 11px;">Delete</button>
                </td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    async function toggleStatus(key, current) {
        const headers = await getHeaders();
        await fetch(`/admin/licenses/${key}/${current ? 'revoke' : 'reactivate'}`, { method: 'POST', headers });
        load();
    }

    async function deleteLic(key) {
        if(!confirm("Delete this license? This will disconnect all bound devices.")) return;
        const headers = await getHeaders();
        await fetch(`/admin/licenses/${key}`, { method: 'DELETE', headers });
        load();
    }

    async function create() {
        const headers = await getHeaders();
        await fetch("/admin/licenses", {
            method: "POST",
            headers,
            body: JSON.stringify({
                max_devices: parseInt(document.getElementById("max_devices").value),
                days: parseInt(document.getElementById("days").value),
                assigned_users: document.getElementById("user_email").value ? [document.getElementById("user_email").value] : []
            })
        });
        load();
    }
    checkUser();
</script>
</body>
</html>
