<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>License Server – Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #020617; color: #e5e7eb; padding: 40px; }
    h1 { font-size: 28px; margin-bottom: 20px; color: #f8fafc; }
    .card { background: #0f172a; border: 1px solid #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px #000; }
    button { background: #f8fafc; color: #020617; padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    button:hover { background: #e2e8f0; transform: translateY(-1px); }
    button.secondary { background: #334155; color: white; margin-left: 5px; }
    button.danger { background: #7f1d1d; color: #fecaca; margin-left: 5px; }
    button.danger:hover { background: #b91c1c; }
    #panel { margin-top: 30px; display: none; }
    table { border-collapse: collapse; margin-top: 20px; width: 100%; font-size: 14px; }
    th, td { border-bottom: 1px solid #1e293b; padding: 12px; text-align: left; }
    th { color: #94a3b8; font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; }
    code { background: #1e293b; padding: 4px 8px; border-radius: 4px; color: #38bdf8; font-family: monospace; }
    .status-pill { padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>

<h1>🔐 License Server Admin</h1>
<button id="loginBtn">Sign in with Google</button>

<div id="panel" class="card">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2 style="margin:0">Active Licenses</h2>
    <button onclick="createLicense()">+ Create New License</button>
  </div>
  <table id="licenses"></table>
</div>

<script>
  const SUPABASE_URL = "https://efhcunpogynphopqcqze.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmaGN1bnBvZ3lucGhvcHFjcXplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg1MzgzOTIsImV4cCI6MjA4NDExNDM5Mn0.Zg2_kT7aqrOAZTMP-RHuct41eCap99SMSau0IPaAG58";

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById("loginBtn").addEventListener("click", () => {
    supabaseClient.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin + "/admin-ui" }
    });
  });

  async function getSession() {
    const { data } = await supabaseClient.auth.getSession();
    return data.session;
  }

  async function apiCall(path, method = 'GET', body = null) {
    const session = await getSession();
    if (!session) return;
    const options = {
      method,
      headers: { 
        "Authorization": "Bearer " + session.access_token,
        "Content-Type": "application/json"
      }
    };
    if (body) options.body = JSON.stringify(body);
    
    const res = await fetch(path, options);
    if (!res.ok) {
        const err = await res.json();
        alert("Error: " + (err.detail || "Request failed"));
        return null;
    }
    return res.json();
  }

  async function fetchLicenses() {
    const data = await apiCall("/admin/licenses");
    if (data) renderLicenses(data);
  }

  async function createLicense() {
    const res = await apiCall("/admin/licenses", "POST", { max_devices: 1, days: 30 });
    if (res) fetchLicenses();
  }

  async function toggleLicense(key, active) {
    const action = active ? 'revoke' : 'reactivate';
    const res = await apiCall(`/admin/licenses/${key}/${action}`, "POST");
    if (res) fetchLicenses();
  }

  async function deleteLicense(key) {
    if (!confirm(`Permanently delete license ${key}?`)) return;
    const res = await apiCall(`/admin/licenses/${key}`, "DELETE");
    if (res) fetchLicenses();
  }

  function renderLicenses(list) {
    const table = document.getElementById("licenses");
    document.getElementById("loginBtn").style.display = "none";
    document.getElementById("panel").style.display = "block";

    table.innerHTML = `
      <tr>
        <th>License Key</th>
        <th>Status</th>
        <th>Devices</th>
        <th>Expires</th>
        <th>Assigned Users</th>
        <th>Actions</th>
      </tr>
    `;
    list.forEach(l => {
      const statusColor = l.active ? '#166534' : '#7f1d1d';
      const statusText = l.active ? 'ACTIVE' : 'REVOKED';
      const users = (l.assigned_users && l.assigned_users.length) ? l.assigned_users.join(", ") : "None";

      table.innerHTML += `
        <tr>
          <td><code>${l.license_key}</code></td>
          <td><span class="status-pill" style="background:${statusColor}">${statusText}</span></td>
          <td>${l.max_devices}</td>
          <td>${l.expires_at ? new Date(l.expires_at).toLocaleDateString() : "-"}</td>
          <td style="font-size:12px; color:#94a3b8">${users}</td>
          <td>
            <button class="secondary" onclick="toggleLicense('${l.license_key}', ${l.active})">
              ${l.active ? 'Revoke' : 'Activate'}
            </button>
            <button class="danger" onclick="deleteLicense('${l.license_key}')">Delete</button>
          </td>
        </tr>
      `;
    });
  }

  (async () => {
    const session = await getSession();
    if (session) fetchLicenses();
  })();
</script>
</body>
</html>
