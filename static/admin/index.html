<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard | Device Management</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#0f172a; --card:#1e293b; --border:#334155; --text:#f1f5f9; --muted:#94a3b8; --accent:#6366f1; --danger:#ef4444; }
body { margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); padding:40px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; box-shadow:0 10px 15px -3px rgba(0,0,0,0.3); }
table { width:100%; border-collapse:collapse; margin-top:20px; }
th { text-align:left; color:var(--muted); font-size:12px; text-transform:uppercase; padding:12px; border-bottom:1px solid var(--border); }
td { padding:16px; border-bottom:1px solid var(--border); font-size:14px; }
button { cursor:pointer; border-radius:8px; border:none; padding:8px 16px; font-size:12px; font-weight:600; transition:.2s; }
.secondary { background:var(--border); color:#fff; }
.danger { background:var(--danger); color:#fff; }
.status-badge { padding:4px 8px; border-radius:6px; font-size:11px; font-weight:bold; }
.status-active { background:#065f46; color:#34d399; }
.status-inactive { background:#991b1b; color:#f87171; }
</style>
</head>
<body>

<div id="login-section" style="max-width:400px; margin:100px auto; text-align:center;">
    <h2>Admin Access</h2>
    <button class="secondary" style="padding:12px 24px;" onclick="login()">Continue with Google</button>
</div>

<div id="admin-panel" style="display:none; max-width:1000px; margin:auto;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1>Device Registry</h1>
        <button class="secondary" onclick="logout()">Logout</button>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Device ID</th>
                    <th>Status</th>
                    <th>Tokens</th>
                    <th>Last Seen</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="devices-tbody"></tbody>
        </table>
    </div>
</div>

<script>
const SB_URL="https://efhcunpogynphopqcqze.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmaGN1bnBvZ3lucGhvcHFjcXplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg1MzgzOTIsImV4cCI6MjA4NDExNDM5Mn0.Zg2_kT7aqrOAZTMP-RHuct41eCap99SMSau0IPaAG58";
const _supabase = supabase.createClient(SB_URL, SB_KEY);

async function getHeaders() {
    const {data:{session}} = await _supabase.auth.getSession();
    return { 'Authorization': `Bearer ${session?.access_token}`, 'Content-Type': 'application/json' };
}

async function load() {
    const r = await fetch("/admin/devices", { headers: await getHeaders() });
    const data = await r.json();
    const tbody = document.getElementById("devices-tbody");
    tbody.innerHTML = data.map(d => `
        <tr>
            <td style="font-family:monospace; color:var(--accent);">${d.device_id}</td>
            <td><span class="status-badge ${d.active ? 'status-active' : 'status-inactive'}">${d.active ? 'Active' : 'Suspended'}</span></td>
            <td style="color:#fbbf24; font-weight:700;">${d.token_balance}</td>
            <td style="color:var(--muted);">${d.last_seen ? new Date(d.last_seen).toLocaleString() : 'Never'}</td>
            <td>
                <button class="secondary" onclick="updateBalance('${d.device_id}')">Add Tokens</button>
                <button class="danger" onclick="deleteDevice('${d.device_id}')">Delete</button>
            </td>
        </tr>
    `).join('');
}

async function updateBalance(id) {
    const amount = prompt("Enter tokens to add:");
    if (!amount) return;
    await fetch(`/admin/devices/${id}`, {
        method: "PATCH",
        headers: await getHeaders(),
        body: JSON.stringify({ token_balance: parseInt(amount) })
    });
    load();
}

async function deleteDevice(id) {
    if (confirm("Delete device permanently?")) {
        await fetch(`/admin/devices/${id}`, { method: "DELETE", headers: await getHeaders() });
        load();
    }
}

async function login() { await _supabase.auth.signInWithOAuth({ provider: "google" }); }
async function logout() { await _supabase.auth.signOut(); location.reload(); }

_supabase.auth.onAuthStateChange((e, s) => {
    if (s) {
        document.getElementById("login-section").style.display = "none";
        document.getElementById("admin-panel").style.display = "block";
        load();
    }
});
</script>
</body>
</html>
