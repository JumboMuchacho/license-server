<!DOCTYPE html>
<html>
<head>
  <title>License Admin</title>
  <style>
    body { font-family: sans-serif; padding: 20px }
    input { margin: 5px }
  </style>
</head>
<body>

<h2>Create License</h2>

<input id="key" placeholder="LICENSE-KEY"><br>
<input id="devices" type="number" placeholder="Max devices"><br>
<input id="days" type="number" placeholder="Expires in days (0 = never)"><br>
<button onclick="create()">Create</button>

<h2>Licenses</h2>
<pre id="out"></pre>

<script>
const token = localStorage.getItem("ADMIN_TOKEN")
if (!token) {
  const t = prompt("Enter ADMIN TOKEN")
  localStorage.setItem("ADMIN_TOKEN", t)
  location.reload()
}

const headers = () => ({
  "Authorization": "Bearer " + localStorage.getItem("ADMIN_TOKEN"),
  "Content-Type": "application/json"
})

function load() {
  fetch("/admin/licenses", { headers: headers() })
    .then(r => r.json())
    .then(d => out.textContent = JSON.stringify(d, null, 2))
}

function create() {
  fetch("/admin/licenses", {
    method: "POST",
    headers: headers(),
    body: JSON.stringify({
      license_key: key.value,
      max_devices: devices.value,
      expires_in_days: days.value
    })
  }).then(load)
}

load()
</script>

</body>
</html>
