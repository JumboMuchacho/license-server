<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>License Admin Panel</title>
    <style>
        :root{
            --bg:#f6f9fc;
            --frame:#ffffff;
            --accent:#e6eef8;
            --text:#0b1220;
            --muted:#6b7280;
            --green:#16a34a; /* active */
            --red:#dc2626;   /* inactive */
            --amber:#f59e0b; /* reactivate */
            --danger:#ef4444; /* revoke */
            --grey:#6b7280; /* delete */
        }
        html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
        .page{min-height:100%;display:flex;align-items:center;justify-content:center;padding:30px}
        .card{width:980px;max-width:96%;background:linear-gradient(180deg,var(--frame),#fbfdff);border-radius:12px;box-shadow:0 6px 20px rgba(13,38,59,0.08);padding:28px 22px 22px;border:1px solid #e6eef8;position:relative}
        .title-badge{position:absolute;left:22px;top:-18px;background:var(--frame);padding:8px 12px;border-radius:10px;border:1px solid #e6eef8;font-weight:700}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
        h1{margin:0;font-size:18px;display:none}
        .controls{display:flex;gap:8px;align-items:center}
        .panel{background:var(--accent);padding:18px;border-radius:8px;margin-bottom:16px;display:flex;gap:18px;align-items:center;justify-content:space-between}
        form{display:flex;gap:12px;align-items:center}
        label{font-size:13px;color:var(--muted)}
        input[type=number],input[type=text],input[type=password]{padding:8px 10px;border-radius:6px;border:1px solid #dbe7f5;background:white}
        input[type=checkbox]{width:18px;height:18px}
        button{padding:8px 12px;border-radius:6px;border:0;cursor:pointer}
        button.primary{background:#2563eb;color:white}
        .result{font-family:monospace;color:var(--muted);margin-top:8px}
        table{width:100%;border-collapse:collapse;margin-top:12px}
        th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eef4fb}
        th{background:transparent;color:var(--muted);font-weight:600}
        .keyCell{display:flex;align-items:center;gap:8px}
        .copyBtn{background:transparent;border-radius:6px;padding:6px;border:1px solid rgba(11,18,32,0.06);cursor:pointer}
        .status-pill{display:inline-block;padding:6px 10px;border-radius:999px;color:white;font-weight:600}
        .status-true{background:var(--green)}
        .status-false{background:var(--red)}
        .btn-action{padding:8px 10px;border-radius:6px;color:white;margin-right:6px}
        .btn-revoke{background:var(--danger)}
        .btn-reactivate{background:var(--amber);color:#111}
        .btn-delete{background:#9ca3af;color:white}
        .actions{display:flex;gap:6px}
        .small-muted{font-size:12px;color:var(--muted)}
        @media (max-width:640px){.panel{flex-direction:column;align-items:stretch}form{flex-direction:column;align-items:stretch}}
        /* dark mode */
        body.dark{--bg:#0b1220;--frame:#0f1724;--accent:#111827;--text:#e6eef8;--muted:#9ca3af}
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <div class="title-badge">License Admin Panel</div>
            <div class="header">
                
                <div class="controls">
                    <input id="adminUser" placeholder="admin" value="admin" style="padding:6px 8px;border-radius:6px;border:1px solid #e6eef8">
                    <input id="adminPass" type="password" placeholder="password" style="padding:6px 8px;border-radius:6px;border:1px solid #e6eef8">
                    <button id="darkToggle" title="Toggle dark mode" style="padding:6px 8px;border-radius:6px;border:1px solid #e6eef8;margin-left:8px">🌙</button>
                </div>
            </div>

            <div class="panel" role="region" aria-label="Create license">
                <form id="licenseForm">
                    <label>Max Devices<br><input type="number" name="max_devices" value="1"></label>
                    <label>Days<br><input type="number" name="days" value="365"></label>
                    <label style="display:flex;align-items:center;gap:8px">Active<input type="checkbox" name="active" checked></label>
                    <div style="display:flex;align-items:center">
                        <button type="submit" class="primary">Create License</button>
                    </div>
                </form>
                <div style="min-width:220px;text-align:right">
                    <div class="small-muted">Create a new license</div>
                    <div class="result" id="result"></div>
                </div>
            </div>

            <h2 style="margin:6px 0 0 0">Existing Licenses</h2>
            <div id="licenses" class="small-muted">Loading…</div>
        </div>
    </div>

    <!-- toast container -->
    <div id="toastContainer" style="position:fixed;right:18px;bottom:18px;z-index:9999"></div>

    <script>
        const form = document.getElementById('licenseForm');

        function getAuthHeaders(){
            const user = document.getElementById('adminUser').value || '';
            const pass = document.getElementById('adminPass').value || '';
            return { 'Authorization': 'Basic ' + btoa(user + ':' + pass) };
        }

        // Toast helper
        function showToast(msg, type='info'){
            const box = document.createElement('div');
            box.textContent = msg;
            box.style.padding = '10px 14px';
            box.style.marginTop = '8px';
            box.style.borderRadius = '8px';
            box.style.color = 'white';
            box.style.fontWeight = '600';
            box.style.boxShadow = '0 6px 18px rgba(2,6,23,0.12)';
            if(type==='success'){ box.style.background = 'linear-gradient(90deg,#16a34a,#059669)'; }
            else if(type==='error'){ box.style.background = 'linear-gradient(90deg,#ef4444,#dc2626)'; }
            else { box.style.background = 'linear-gradient(90deg,#2563eb,#1d4ed8)'; }
            const container = document.getElementById('toastContainer'); container.appendChild(box);
            setTimeout(()=>{ box.style.opacity = '0'; box.style.transition='opacity 300ms'; setTimeout(()=>container.removeChild(box),400); },3000);
        }

        // Dark mode toggle
        const darkToggle = document.getElementById('darkToggle');
        function initDark(){
            const saved = localStorage.getItem('admin_dark');
            if(saved === '1'){ document.body.classList.add('dark'); darkToggle.textContent='☀️'; }
        }
        initDark();
        darkToggle.addEventListener('click', ()=>{
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('admin_dark', isDark ? '1' : '0');
            darkToggle.textContent = isDark ? '☀️' : '🌙';
        });

        async function fetchLicenses(){
            const headers = getAuthHeaders();
            const res = await fetch('/admin/licenses', { headers });
            const container = document.getElementById('licenses');
            if (!res.ok){ container.textContent = 'Failed to load licenses: ' + res.status; return; }
            const list = await res.json();
            container.innerHTML = '';
            if (!Array.isArray(list) || list.length === 0){ container.textContent = 'No licenses yet.'; return; }

            const table = document.createElement('table');
            const header = document.createElement('tr');
            ['Key','Max Devices','Active','Expires At','Actions'].forEach(h => { const th=document.createElement('th');th.textContent=h;header.appendChild(th); });
            table.appendChild(header);

            list.forEach(l=>{
                const tr = document.createElement('tr');

                // Key cell with copy icon
                const keyTd = document.createElement('td');
                keyTd.className = 'keyCell';
                const keyText = document.createElement('span'); keyText.textContent = l.license_key;
                const copyBtn = document.createElement('button'); copyBtn.className = 'copyBtn'; copyBtn.title = 'Copy license key';
                copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16 1H4c-1.1 0-2 .9-2 2v12h2V3h12V1z" fill="currentColor"/><path d="M20 5H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h12v14z" fill="currentColor"/></svg>';
                copyBtn.addEventListener('click', async ()=>{ try{ await navigator.clipboard.writeText(l.license_key); copyBtn.textContent='Copied'; setTimeout(()=>{ copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16 1H4c-1.1 0-2 .9-2 2v12h2V3h12V1z" fill="currentColor"/><path d="M20 5H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h12v14z" fill="currentColor"/></svg>'; },1000);}catch(e){ showToast('Copy failed','error'); } });
                keyTd.appendChild(copyBtn); keyTd.appendChild(keyText);

                const maxTd = document.createElement('td'); maxTd.textContent = l.max_devices;

                const activeTd = document.createElement('td');
                const pill = document.createElement('span'); pill.className='status-pill ' + (l.active ? 'status-true' : 'status-false'); pill.textContent = l.active ? 'Active' : 'Inactive';
                activeTd.appendChild(pill);

                const expTd = document.createElement('td'); expTd.textContent = l.expires_at || '';

                const actionsTd = document.createElement('td'); actionsTd.className='actions';
                const revokeBtn = document.createElement('button'); revokeBtn.className='btn-action btn-revoke'; revokeBtn.textContent='Revoke'; revokeBtn.addEventListener('click', async ()=>{ if(confirm('Revoke '+l.license_key+'?')){ const ok = await callAction('revoke', l.license_key); if(ok) showToast('Revoked '+l.license_key,'success'); } });
                const reactivateBtn = document.createElement('button'); reactivateBtn.className='btn-action btn-reactivate'; reactivateBtn.textContent='Reactivate'; reactivateBtn.addEventListener('click', async ()=>{ const ok = await callAction('reactivate', l.license_key); if(ok) showToast('Reactivated '+l.license_key,'success'); });
                const delBtn = document.createElement('button'); delBtn.className='btn-action btn-delete'; delBtn.textContent='Delete'; delBtn.addEventListener('click', async ()=>{ if(confirm('Delete '+l.license_key+'?')){ const ok = await callAction('delete', l.license_key); if(ok) showToast('Deleted '+l.license_key,'success'); } });
                const usersBtn = document.createElement('button'); usersBtn.className='btn-action'; usersBtn.style.background='#eef2ff'; usersBtn.style.color='#111'; usersBtn.textContent='Users';
                actionsTd.appendChild(revokeBtn); actionsTd.appendChild(reactivateBtn); actionsTd.appendChild(delBtn); actionsTd.appendChild(usersBtn);

                tr.appendChild(keyTd); tr.appendChild(maxTd); tr.appendChild(activeTd); tr.appendChild(expTd); tr.appendChild(actionsTd);
                table.appendChild(tr);

                // users panel row
                const tr2 = document.createElement('tr');
                const td2 = document.createElement('td'); td2.colSpan = 5; td2.style.padding = '8px 12px 16px 12px';
                const panel = document.createElement('div'); panel.style.display='none'; panel.style.background='rgba(15,23,42,0.03)'; panel.style.padding='10px'; panel.style.borderRadius='8px';
                // build inputs up to max_devices
                const users = Array.isArray(l.assigned_users) ? l.assigned_users : [];
                const inputs = [];
                for(let i=0;i<l.max_devices;i++){
                    const wrap = document.createElement('div'); wrap.style.display='flex'; wrap.style.gap='8px'; wrap.style.marginBottom='6px';
                    const lbl = document.createElement('div'); lbl.textContent = 'User ' + (i+1) + ':'; lbl.style.width='70px'; lbl.style.color='var(--muted)';
                    const inp = document.createElement('input'); inp.type='text'; inp.value = users[i] || ''; inp.style.flex='1'; inp.style.padding='6px 8px'; inp.style.border='1px solid #e6eef8'; inp.style.borderRadius='6px';
                    wrap.appendChild(lbl); wrap.appendChild(inp); panel.appendChild(wrap); inputs.push(inp);
                }
                const saveBtn = document.createElement('button'); saveBtn.textContent='Save Users'; saveBtn.className='primary'; saveBtn.style.background='#10b981'; saveBtn.style.borderRadius='6px'; saveBtn.addEventListener('click', async ()=>{
                    const values = inputs.map(i=>i.value.trim()).filter(x=>x);
                    try{
                        const headers = Object.assign({'Content-Type':'application/json'}, getAuthHeaders());
                        const res = await fetch('/admin/licenses/' + encodeURIComponent(l.license_key) + '/users',{ method:'POST', headers, body: JSON.stringify({ users: values }) });
                        if(!res.ok){ showToast('Save users failed: '+res.status,'error'); return; }
                        showToast('Users saved','success');
                        await fetchLicenses();
                    }catch(e){ showToast('Save failed','error'); }
                });
                panel.appendChild(saveBtn);
                td2.appendChild(panel); tr2.appendChild(td2); table.appendChild(tr2);

                // toggle panel
                usersBtn.addEventListener('click', ()=>{ panel.style.display = panel.style.display === 'none' ? 'block' : 'none'; });
            });

            container.appendChild(table);
        }

        async function callAction(action,key){
            const headers = getAuthHeaders();
            let url = '/admin/licenses/' + encodeURIComponent(key) + '/' + action;
            let opts = { method:'POST', headers };
            if(action==='delete'){ url = '/admin/licenses/' + encodeURIComponent(key); opts = { method:'DELETE', headers }; }
            const res = await fetch(url, opts);
            if(!res.ok){ showToast('Action failed: '+res.status,'error'); return false; }
            await fetchLicenses();
            return true;
        }

        form.addEventListener('submit', async e=>{
            e.preventDefault();
            const headers = Object.assign({'Content-Type':'application/json'}, getAuthHeaders());
            const data = Object.fromEntries(new FormData(form).entries()); data.active = data.active === 'on';
            const res = await fetch('/admin/licenses', { method:'POST', headers, body: JSON.stringify({ max_devices: Number(data.max_devices), days: Number(data.days), active: data.active }) });
            const json = await res.json();
            document.getElementById('result').textContent = JSON.stringify(json);
            await fetchLicenses();
        });

        document.getElementById('adminPass').addEventListener('change', fetchLicenses);
        document.getElementById('adminPass').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); fetchLicenses(); } });

        // initial load
        fetchLicenses();
    </script>
</body>
</html>
